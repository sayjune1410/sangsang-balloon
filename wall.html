<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>상상을 띄우다 | WALL</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="wall-page">
<div class="page">
  <div class="grain"></div>
  <header class="site-header">
    <div class="eyebrow"><span class="dot"></span> <span class="live-indicator">LIVE WALL</span></div>
    <h1 class="hero-title">우리의 <span class="red">상상</span>이 모이고 있습니다 🎈</h1>
    <div class="count-pill">지금까지 <strong data-count>0</strong>개의 상상</div>
  </header>
  <main class="sky">
    <div class="cloud c1"></div><div class="cloud c2"></div>
    <div class="wall-grid" id="balloonField"></div>
  </main>
</div>
<div class="wall-toolbar" id="toolbar">
  <button class="tool-btn" id="autoBtn">자동 스크롤 OFF</button>
  <button class="tool-btn" id="topBtn">맨 위로</button>
  <button class="tool-btn" id="fullBtn">전체화면</button>
  <button class="tool-btn" id="hideBtn">도구 숨기기 (H)</button>
</div>
<div class="modal" id="modal"><div class="modal-card"><button class="close" id="closeModal">×</button><h3>작은 상상 🎈</h3><p id="modalText"></p></div></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
(async () => {
  const A=window.SangsangApp, field=document.getElementById('balloonField'), toolbar=document.getElementById('toolbar');
  let wishes=[], previousCount=0, auto=false, raf=0, last=0;
  A.bindModal();
  function render(){ field.innerHTML=''; wishes.forEach((w,i)=>field.appendChild(A.makeBalloon(w,{index:i,onClick:A.showModal,isNew:i>=previousCount}))); A.setCount(wishes.length); }
  async function refresh(){ try{ const next=await A.listWishes(); previousCount=wishes.length; wishes=next; render(); if(wishes.length>previousCount && previousCount>0) A.toast(`${wishes.length}번째 상상이 도착했어요 🎈`); setTimeout(()=>{previousCount=wishes.length; render();},1300);}catch(e){A.toast(e.message||'연결 오류');} }
  function autoLoop(ts){ if(!auto) return; if(ts-last>40){ window.scrollBy(0,.7); last=ts; if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4){ auto=false; document.getElementById('autoBtn').textContent='자동 스크롤 OFF'; } } raf=requestAnimationFrame(autoLoop); }
  document.getElementById('autoBtn').onclick=()=>{ auto=!auto; document.getElementById('autoBtn').textContent=`자동 스크롤 ${auto?'ON':'OFF'}`; cancelAnimationFrame(raf); if(auto) raf=requestAnimationFrame(autoLoop); };
  document.getElementById('topBtn').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
  document.getElementById('fullBtn').onclick=()=>document.documentElement.requestFullscreen?.();
  function toggleTools(){ toolbar.classList.toggle('hidden'); }
  document.getElementById('hideBtn').onclick=toggleTools;
  document.addEventListener('keydown',e=>{ if(e.key.toLowerCase()==='h') toggleTools(); if(e.key.toLowerCase()==='f') document.documentElement.requestFullscreen?.(); if(e.key.toLowerCase()==='a') document.getElementById('autoBtn').click(); });
  await refresh(); await A.subscribe(refresh);
})();
</script>
</body>
</html>
